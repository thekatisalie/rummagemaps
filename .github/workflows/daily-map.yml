name: Post Daily Palia Maps

on:
  schedule:
    - cron: "0 14 * * *" # 8 AM Central
  workflow_dispatch:

jobs:
  post-maps:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          npm install puppeteer axios form-data

      - name: Capture Maps and Post to Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          node <<'EOF'
          const puppeteer = require('puppeteer');
          const fs = require('fs');
          const axios = require('axios');
          const FormData = require('form-data');

          const maps = [
            { name: "kilima", title: "Kilima Valley", url: "https://palia.th.gl/rummage-pile?map=kilima-valley", color: 15158332 },
            { name: "bahari", title: "Bahari Bay", url: "https://palia.th.gl/rummage-pile?map=bahari-bay", color: 3447003 },
            { name: "elderwood", title: "Elderwood", url: "https://palia.th.gl/rummage-pile?map=elderwood", color: 5763719 }
          ];

          (async () => {
            const browser = await puppeteer.launch({ args: ['--no-sandbox'] });
            const page = await browser.newPage();

            const embeds = [];

            for (const map of maps) {
              await page.goto(map.url, { waitUntil: 'networkidle2' });
              // Wait a bit to ensure map renders
              await page.waitForTimeout(3000);

              const fileName = map.name + '.png';
              await page.screenshot({ path: fileName, fullPage: true });

              embeds.push({
                title: map.title,
                color: map.color,
                image: { url: `attachment://${fileName}` }
              });
            }

            await browser.close();

            // Prepare FormData for webhook
            const form = new FormData();
            for (const map of maps) {
              form.append('file', fs.createReadStream(map.name + '.png'));
            }

            form.append('payload_json', JSON.stringify({
              content: "🌿 Daily Rummage Pile Locations!",
              embeds
            }));

            await axios.post(process.env.WEBHOOK_URL, form, { headers: form.getHeaders() });
            console.log("Posted all maps to Discord!");
          })();
          EOF

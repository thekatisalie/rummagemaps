name: Post Daily Palia Maps

on:
  schedule:
    - cron: "0 14 * * *" # 8 AM Central
  workflow_dispatch:

jobs:
  post-maps:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          npm init -y
          npm install axios form-data

      - name: Download maps and post to Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          node <<'EOF'
          const fs = require('fs');
          const axios = require('axios');
          const FormData = require('form-data');

          const maps = [
            { name: 'kilima', title: 'Kilima Valley', url: 'https://console-apps.overwolf.com/prod/apps/fgbodfoepckgplklpccjedophlahnjemfdknhfce/assets/4f5248be-b343-460b-93e4-cba706ad9c14.jpg' },
            { name: 'bahari', title: 'Bahari Bay', url: 'https://console-apps.overwolf.com/prod/apps/fgbodfoepckgplklpccjedophlahnjemfdknhfce/assets/4f5248be-b343-460b-93e4-cba706ad9c14.jpg' },
            { name: 'elderwood', title: 'Elderwood', url: 'https://console-apps.overwolf.com/prod/apps/fgbodfoepckgplklpccjedophlahnjemfdknhfce/assets/4f5248be-b343-460b-93e4-cba706ad9c14.jpg' }
          ];

          (async () => {
            const embeds = [];
            const form = new FormData();

            // Get today's date
            const today = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            const dateString = today.toLocaleDateString('en-US', options);

            for (const map of maps) {
              const response = await axios.get(map.url, { responseType: 'arraybuffer' });
              const fileName = map.name + '.jpg';
              fs.writeFileSync(fileName, response.data);
              form.append('file', fs.createReadStream(fileName));
              embeds.push({
                title: map.title,
                image: { url: `attachment://${fileName}` }
              });
            }

            form.append('payload_json', JSON.stringify({
              content: `<@&1472988485920100556> 🌿 Daily Rummage Pile Locations — ${dateString}!`,
              embeds
            }));

            await axios.post(process.env.WEBHOOK_URL, form, { headers: form.getHeaders() });
            console.log('Posted all three maps to Discord with date and role ping.');
          })();
          EOF

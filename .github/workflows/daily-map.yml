name: Post Daily Palia Maps

on:
  schedule:
    - cron: "0 14 * * *" # 8 AM Central
  workflow_dispatch:

jobs:
  post-maps:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          npm init -y
          npm install puppeteer axios form-data

      - name: Capture Maps and Post to Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          node <<'EOF'
          const puppeteer = require('puppeteer');
          const fs = require('fs');
          const axios = require('axios');
          const FormData = require('form-data');

          const maps = [
            { name: "kilima", title: "Kilima Valley", selector: 'a[href*="kilima-valley"]', color: 15158332 },
            { name: "bahari", title: "Bahari Bay", selector: 'a[href*="bahari-bay"]', color: 3447003 },
            { name: "elderwood", title: "Elderwood", selector: 'a[href*="elderwood"]', color: 5763719 }
          ];

          (async () => {
            const browser = await puppeteer.launch({ args: ['--no-sandbox', '--disable-setuid-sandbox'] });
            const page = await browser.newPage();
            await page.goto('https://palia.th.gl/rummage-pile', { waitUntil: 'networkidle2' });

            const embeds = [];

            for (const map of maps) {
              // Click the region tab/link
              const regionLink = await page.$(map.selector);
              if (regionLink) {
                await regionLink.click();
                await new Promise(resolve => setTimeout(resolve, 3000)); // wait for map to render
              }

              // Select the map element (canvas or container)
              const mapElement = await page.$('canvas'); // adjust if the map uses a different element
              const fileName = map.name + '.png';
              if (mapElement) {
                await mapElement.screenshot({ path: fileName });
              } else {
                await page.screenshot({ path: fileName, fullPage: true });
              }

              embeds.push({
                title: map.title,
                color: map.color,
                image: { url: `attachment://${fileName}` }
              });
            }

            await browser.close();

            // Today's date
            const today = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            const dateString = today.toLocaleDateString('en-US', options);

            const form = new FormData();
            for (const map of maps) {
              form.append('file', fs.createReadStream(map.name + '.png'));
            }

            form.append('payload_json', JSON.stringify({
              content: `<@&1472988485920100556> 🌿 Daily Rummage Pile Locations — ${dateString}!`,
              embeds
            }));

            await axios.post(process.env.WEBHOOK_URL, form, { headers: form.getHeaders() });
            console.log("Posted all maps to Discord with date and role ping!");
          })();
          EOF
